<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Doctor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1b4332" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V8"/><path d="M5 12c0-5 3-9 7-9s7 4 7 9c0 4-3 7-7 7s-7-3-7-7z"/><path d="M9 10c1 2 2 4 3 6"/></svg>
                <span class="logo">Plant Doctor</span>
            </div>
            <p class="tagline">Detect leaf diseases and get treatment advice</p>
        </header>

        <section id="step-plant" class="step active">
            <div class="step-label">Choose your plant</div>
            <div class="plant-grid" id="plant-grid"></div>
        </section>

        <section id="step-upload" class="step">
            <button class="back-btn" id="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
                Back to plants
            </button>
            <div class="step-label">Upload a leaf photo of <span id="chosen-plant-name" class="chosen-name"></span></div>
            <div id="drop-zone" class="drop-zone">
                <div id="preview-area" class="preview-area">
                    <div class="upload-prompt">
                        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        <p>Drop a leaf photo here</p>
                        <span class="hint">or click to browse</span>
                    </div>
                </div>
                <input type="file" id="file-input" accept="image/*" hidden>
            </div>
        </section>

        <section id="step-results" class="step">
            <button class="back-btn" id="restart-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
                Diagnose another plant
            </button>
            <div id="diagnosis-card" class="diagnosis-card"></div>
            <div id="alt-results" class="alt-results"></div>
        </section>
    </div>

    <div id="scan-overlay" class="scan-overlay">
        <div class="scan-content">
            <div class="scan-photo-wrap">
                <img id="scan-img" src="" alt="Scanning">
                <div class="scan-line"></div>
            </div>
            <p class="scan-text">Analyzing leaf...</p>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
